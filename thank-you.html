<!DOCTYPE html>
<html lang="en-ZA">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Thank You — ZelvoraLead</title>
<meta name="description" content="Thanks for reaching out to ZelvoraLead. We'll be in touch within one business day.">
<meta name="robots" content="noindex, follow">
<link rel="canonical" href="https://zelvoralead.co.za/thank-you.html">
<link rel="icon" type="image/png" href="/favicon.png">
<link rel="shortcut icon" href="/favicon.ico">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{ --black:#080A0A; --off-white:#F5F5F0; --lime:#CFFF3D; --lime-deep:#9FCB1E; --muted:#8D9390; --border:#242827; --font-display:'Space Grotesk',sans-serif; --font-body:'Inter',sans-serif; }
  *{box-sizing:border-box;}
  body{
    margin:0; min-height:100vh; background:var(--black); color:var(--off-white); font-family:var(--font-body);
    display:flex; flex-direction:column; align-items:center; justify-content:center; text-align:center; padding:40px 20px;
  }
  .logo{ display:flex; align-items:center; gap:10px; margin-bottom:44px; }
  .logo svg{ width:38px; height:auto; }
  .logo span{ font-family:var(--font-display); font-weight:700; font-size:1.2rem; }
  .check{ width:64px; height:64px; border-radius:50%; border:2px solid var(--lime); display:flex; align-items:center; justify-content:center; margin-bottom:28px; }
  h1{ font-family:var(--font-display); font-size:clamp(1.8rem,5vw,2.6rem); margin:0 0 14px; max-width:16ch; }
  h1 .lime{ color:var(--lime); }
  p{ color:rgba(245,245,240,0.75); font-size:1.05rem; max-width:46ch; line-height:1.6; margin:0 0 34px; }
  .btn{
    display:inline-flex; align-items:center; gap:8px; font-family:var(--font-display); font-weight:700; font-size:0.92rem;
    text-transform:uppercase; letter-spacing:0.02em; padding:14px 26px; border-radius:8px; text-decoration:none;
    background:var(--lime); color:var(--black);
  }
  .back{ margin-top:22px; color:var(--muted); font-family:var(--font-display); font-size:0.85rem; text-decoration:none; }
</style>
</head>
<body>
  <div class="logo">
    <svg viewBox="0 0 608 328" xmlns="http://www.w3.org/2000/svg"><polygon fill="#CFFF3D" points="0,0 508,0 560,52 560,68 68,212 560,212 560,280 52,280 0,228 0,212 492,68 0,68"/></svg>
    <span>ZelvoraLead</span>
  </div>
  <div class="check">
    <svg width="28" height="28" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg"><path d="M4 12.5L9 17.5L20 6.5" stroke="#CFFF3D" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></svg>
  </div>
  <h1>Got It. <span class="lime">We're On It.</span></h1>
  <p>Thanks for reaching out — your details have landed with us. We'll personally get back to you within one business day, usually sooner.</p>
  <a href="/" class="btn">Back To The Site</a>
  <a href="/" class="back">← Return home</a>
</body>
</html>
